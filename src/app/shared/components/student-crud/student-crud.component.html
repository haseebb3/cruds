<p class="bg-info text-white h1 text-center text-capitalize p-3">Student crud in angular</p>

<div class="container-fluid">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-info text-white text-center">
                        <h1>{{isInEditMode ? "Update Todo" : "Add Todo"}}</h1>
                    </div>
                    <div class="card-body">
                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text" class="form-control" #fname>
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text" class="form-control" #lname>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="text" class="form-control" #email>
                        </div>
                        <div class="form-group">
                            <label>Contact</label>
                            <input type="number" class="form-control" #contact>
                        </div>
                        <div class="form-group">
                            <label>Is Active?</label>
                            <select class="form-control" #isActive>
                                <option value="yes">Active</option>
                                <option value="no">InActive</option>
                            </select>
                        </div>

                        <button mat-raised-button color="accent" class="w-100" *ngIf="!isInEditMode; else updateButton"
                        (click)="onStudentAdd()"
                        >
                            Add Todo
                        </button>
                        <ng-template #updateButton>
                            <button mat-raised-button color="primary" class="w-100"
                            (click)="onUpdate()"
                            >
                                Update Todo
                            </button>
                        </ng-template>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="table-responsvie">
                    <div class="card">
                        <div class="card-header bg-info text-white text-center pb-0">
                            <h1>Students List</h1>
                        </div>

                        <div class="card-body pt-0 stdContainer">
                            <table class="table table-bordered">
                                <thead>
                                    <tr class="bg-dark text-white ">
                                        <th>Sr No</th>
                                        <th>Full Name</th>
                                        <th>Email</th>
                                        <th>Contact</th>
                                        <th>Is Active</th>
                                        <th>Edit</th>
                                        <th>Remove</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr *ngFor="let std of studentsArray; index as i">
                                        <td>{{i + 1}}</td>
                                        <td>{{std.firstName}} {{std.lastName}}</td>
                                        <td>{{std.email}}</td>
                                        <td>{{std.contact}}</td>
                                        <td><span class="badge" [ngClass]="{
                                            'badge-success' : std.isActive,
                                            'badge-danger' : !std.isActive
                                        }">{{std.isActive ? "Active" : "InActive"}}</span></td>
                                        <td>
                                            <button mat-mini-fab color="accent"
                                            (click)="onEdit(std)"
                                            >
                                                <mat-icon>edit</mat-icon>
                                            </button>
                                        </td>
                                        <td>
                                            <button mat-mini-fab color="warn"
                                            (click)="onDelete(std.id)"
                                            >
                                                <mat-icon>delete</mat-icon>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
