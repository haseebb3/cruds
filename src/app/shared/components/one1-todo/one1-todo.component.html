<p class="bg-primary text-center h1 p-2">Todo CRUD in Angular</p>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-4 offset-md-1">
            <div class="card">
                <div class="card-header bg-primary text-white text-center">
                    <h1>{{isInEditMode ? 'Update Todo' : 'Add Todo'}}</h1>
                </div>

                <div class="card-body">
                    <div class="form-group">
                        <label>Todo Item</label>
                        <input type="text" class="form-control" #todoItemRef>
                    </div>
                    <div class="form-group">
                        <label>Is Completed</label>
                        <select class="form-control" #isCompleted>
                            <option value="no">No</option>
                            <option value="yes">Yes</option>
                        </select>

                    </div>
                    <button mat-flat-button color="accent" class="w-100" 
                    *ngIf="!isInEditMode; else editButton"
                    (click)="onTodoAdd()"
                    >Add
                        Todo</button>
                    <ng-template #editButton>
                        <button mat-flat-button color="accent" class="w-100" (click)="onUpdate()">Update
                            Todo</button>
                    </ng-template>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white text-center">
                    <h1>Todo List</h1>
                </div>
                <div class="card-body">
                    <ul class="list-group" *ngIf="todoArr.length > 0; else noTodo">
                        <li class="list-group-item d-flex justify-content-between align-items-center"
                            *ngFor="let todo of todoArr; trackBy : trackByTodoId">
                            <div>
                                <input type="checkbox" 
                                [checked]="todo.isCompleted"
                                >
                                <strong class="pl-2">{{todo.todoItem}}</strong>
                            </div>
                            <div>
                                <button mat-mini-fab color="accent" class="mr-2" (click)="onEdit(todo)">
                                    <mat-icon>edit</mat-icon>
                                </button>
                                <button mat-mini-fab color="warn" (click)="onDelete(todo.todoId)">
                                    <mat-icon>delete</mat-icon>
                                </button>
                            </div>
                        </li>
                    </ul>
                    <ng-template #noTodo>
                        <p class="text-center"> <strong class="h3 text-danger">
                                No todos added yet!!!
                            </strong></p>
                    </ng-template>


                </div>
            </div>
        </div>
    </div>
</div>
